# ==============================================================================
# Default profile
# ==============================================================================

[profile.default]
src = "src"
out = "out"
libs = ["lib"]

solc_version = "0.8.39"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200

ignored_warnings_from = ["lib/"]

# Symbolic checks compile everywhere but run only in their profile.
no_match_path = "test/symbolic/**"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

# ==============================================================================
# CI profile
# ==============================================================================

[profile.ci.fuzz]
runs = 4096

[profile.ci.invariant]
runs = 256
depth = 128

# ==============================================================================
# Opt-in profiles
# ==============================================================================

# Native symbolic checks (`forge test --symbolic`); needs z3 on PATH.
[profile.symbolic]
match_path = "test/symbolic/**"
no_match_path = "test/gas/**"

[profile.symbolic.symbolic]
timeout = 30
max_paths = 1024
max_depth = 20000
invariant_depth = 4

# Forge mutation testing (`just mutate`). A mutant that hangs is recorded as 
# timed out after a minute.
[mutation]
timeout = 60

# ==============================================================================
# Tools
# ==============================================================================

[lint]
lint_on_build = false

[fmt]
bracket_spacing = true
line_length = 120
